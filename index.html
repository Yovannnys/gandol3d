    :root {
      --bg: #0f172a;

    header {

      justify-content: space-between;

    .brand {

      color: var(--text);
    }

    .brand-badge {

      border-radius: 10px;

      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #0f172a;
      font-size: 15px;
      box-shadow: 0 6px 18px rgba(245, 158, 11, 0.3);
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-title span {
      color: var(--accent);
