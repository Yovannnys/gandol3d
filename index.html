        // Filtra e renderiza os cards de produtos com animação
        function filtrarCategoria(categoria) {
            filtroAtual = categoria;

            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.filter === categoria) {
                    btn.style.backgroundColor = "var(--accent-primary)";
                    btn.classList.remove('bg-slate-800/80', 'text-slate-300', 'border', 'border-slate-700/60');
                    btn.classList.add('text-white', 'shadow-lg');
                } else {
                    btn.style.backgroundColor = "";
                    btn.classList.remove('text-white', 'shadow-lg');
                    btn.classList.add('bg-slate-800/80', 'text-slate-300', 'border', 'border-slate-700/60');
                }
            });

            let listaFiltrada = PRODUTOS.filter(prod => {
                if (categoria === 'todos') return true;
                if (categoria === 'temporada') {
                    return prod.categoria === 'temporada' || (prod.temporadas && prod.temporadas.includes(temporadaAtual));
                }
                return prod.categoria === categoria;
            });

            if (categoria === 'todos') {
                listaFiltrada.sort((a, b) => {
                    const aDestaque = a.temporadas && a.temporadas.includes(temporadaAtual) ? 1 : 0;
                    const bDestaque = b.temporadas && b.temporadas.includes(temporadaAtual) ? 1 : 0;
                    return bDestaque - aDestaque;
                });
            }

            renderizarProdutos(listaFiltrada);
        }

                : `<div class="scale-125">${svgIlustracao}</div>`;

            const msg = encodeURIComponent(`Olá Gandol3D! Gostaria de encomendar o modelo "${prod.nome}" que vi no catálogo.`);
            document.getElementById('modal-whatsapp-link').href = `https://wa.me/${WHATSAPP_NUMERO}?text=${msg}`;

            const modal = document.getElementById('quick-view-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function fecharModal() {
            const modal = document.getElementById('quick-view-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // Fecha modal ao clicar fora
        document.getElementById('quick-view-modal').addEventListener('click', (e) => {
            if (e.target.id === 'quick-view-modal') fecharModal();
        });

        // Envia o formulário de encomenda personalizada direto para o WhatsApp
        function enviarEncomendaWhatsApp(event) {
            event.preventDefault();
            const nome = document.getElementById('cliente-nome').value.trim();
            const categoria = document.getElementById('cliente-categoria').value;
            const cores = document.getElementById('cliente-cores').value.trim() || "A combinar";
            const detalhes = document.getElementById('cliente-detalhes').value.trim();

            const texto = `Olá Gandol3D! Gostaria de fazer um orçamento personalizado:\n\n` +
                          `• *Nome:* ${nome}\n` +
                          `• *Categoria:* ${categoria}\n` +
                          `• *Cores desejadas:* ${cores}\n` +
                          `• *Detalhes do pedido:* ${detalhes}`;

            const url = `https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank', 'noopener,noreferrer');
        }

        // Inicialização ao carregar a página
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('ano-atual').textContent = new Date().getFullYear();
            mudarTemporada(TEMPORADA_PADRAO);
        });
    </script>
</body>
</html>
